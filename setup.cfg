[bumpversion]
current_version = 0.1.1
commit = True
tag = True

[bumpversion:file:setup.py]
search = version='{current_version}'
replace = version='{new_version}'

[bumpversion:file:/__init__.py]
search = __version__ = '{current_version}'
replace = __version__ = '{new_version}'

[bdist_wheel]
universal = 1

[options]
packages = find:
python_requires = >=3.10
install_requires =
    adjustText>=0.7.3
    KDEpy>=1.1.0
    matplotlib>=3.4.2
    numpy>=1.21.0
    pandas>=1.3.0
    patsy>=0.5.1
    scipy>=1.7.0
    scikit-learn>=0.24
    statsmodels>=0.12.2
    tqdm>=4.61.2

[options.extras_require]
dev =
    flake8
    pytest
    pytest-benchmark

[flake8]
exclude = docs
max-line-length = 88

[aliases]
# Define setup.py command aliases here
test = pytest

[tool:pytest]
filterwarnings =
    ignore::DeprecationWarning:tarfile
markers =
    benchmark: marks tests as benchmark tests (deselect with '-m "not benchmark"')
